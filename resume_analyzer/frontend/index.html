<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Docket — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-side">
      <div class="auth-side-top">
        <div class="wordmark">Docket<span class="dot">.</span></div>
        <p class="auth-tagline">Every résumé, reviewed like a case file — matched, scored, and explained.</p>
      </div>
      <div class="auth-side-bottom">
        <p class="auth-meta">AI Resume Analyzer &middot; graduation project</p>
      </div>
    </div>

    <div class="auth-main">
      <div class="auth-panel">
        <div class="auth-tabs">
          <div class="auth-tab active" data-tab="login" onclick="switchTab('login')">Sign in</div>
          <div class="auth-tab" data-tab="register" onclick="switchTab('register')">Create account</div>
        </div>

        <div class="auth-error" id="auth-error"></div>

        <form class="auth-form active" id="login-form" data-tab="login">
          <div class="field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Sign in</button>
        </form>

        <form class="auth-form" id="register-form" data-tab="register">
          <div class="field">
            <label for="reg-name">Full name</label>
            <input type="text" id="reg-name" required />
          </div>
          <div class="field">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" required minlength="8" autocomplete="new-password" />
            <div class="field-hint">At least 8 characters.</div>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Create account</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
