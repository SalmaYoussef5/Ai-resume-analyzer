<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Docket — My résumés</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div id="nav-root"></div>

    <div class="main">
      <div class="page-head">
        <div>
          <h1>My résumés</h1>
          <p>Upload a résumé to get an AI-read breakdown and matching roles.</p>
        </div>
      </div>

      <div class="split">
        <div class="split-side">
          <div class="section-label">Files on record</div>
          <div id="resume-list"></div>

          <div class="dropzone">
            Upload a PDF or DOCX résumé
            <input type="file" id="file-input" accept=".pdf,.docx" />
          </div>
        </div>

        <div class="split-main" id="resume-detail">
          <div class="placeholder-note">Select a résumé on the left, or upload a new one to begin.</div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/resumes.js"></script>
</body>
</html>
