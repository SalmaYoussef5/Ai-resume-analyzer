<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Docket — Open roles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div id="nav-root"></div>

    <div class="main">
      <div class="page-head">
        <div>
          <h1>Open roles</h1>
          <p>Browse postings, or add a role to match candidates against.</p>
        </div>
        <button class="btn btn-brass" onclick="openPostForm()">Post a role</button>
      </div>

      <div class="filter-bar">
        <input type="text" id="f-title" placeholder="Title" />
        <input type="text" id="f-location" placeholder="Location" />
        <input type="text" id="f-category" placeholder="Category" />
        <input type="text" id="f-skill" placeholder="Skill" />
        <button class="btn btn-outline" onclick="loadJobs()">Search</button>
        <button class="btn btn-ghost" onclick="clearFilters()">Clear</button>
      </div>

      <div id="post-form-wrap" style="display:none; margin-bottom: 32px;">
        <div class="form-card" style="max-width: 640px;">
          <h3>New role</h3>
          <div class="field">
            <label for="p-title">Title</label>
            <input type="text" id="p-title" required />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="p-location">Location</label>
              <input type="text" id="p-location" />
            </div>
            <div class="field">
              <label for="p-category">Category</label>
              <input type="text" id="p-category" placeholder="e.g. Backend" />
            </div>
          </div>
          <div class="field">
            <label for="p-skills">Required skills</label>
            <input type="text" id="p-skills" placeholder="Python, FastAPI, SQL" required />
          </div>
          <div class="field">
            <label for="p-desc">Description</label>
            <textarea id="p-desc" required></textarea>
          </div>
          <div style="display:flex; gap:10px;">
            <button class="btn btn-primary" onclick="submitJob()">Publish role</button>
            <button class="btn btn-ghost" onclick="closePostForm()">Cancel</button>
          </div>
        </div>
      </div>

      <div id="jobs-list" class="entry-list"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/jobs.js"></script>
</body>
</html>
